name: sbackup
description: "sBackup — sauvegarde automatique des photos et vidéos du téléphone sur le NAS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit_300Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit_600SemiBold.ttf
          weight: 600
