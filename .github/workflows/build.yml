name: Construire sBackup

on:
  # Un changement qui ne touche que la documentation ne recompile rien et ne publie pas
  # de version (l'application serait identique à la précédente).
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      publier:
        description: Publier cette compilation comme nouvelle version (Release)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9
  VERSION: 1.0.${{ github.run_number }}

jobs:
  tests:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Analyse statique
        run: flutter analyze
      - name: Format
        run: dart format -l 120 --set-exit-if-changed lib test
      # Les tests font tourner le moteur de sauvegarde contre une destination factice
      # (coupures, reprise, fichiers abîmés, conflits de noms) et parcourent l'interface à
      # plusieurs tailles d'écran.
      - name: Tests
        run: flutter test

  android:
    name: APK Android
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get

      # Facultatif : avec une clé personnelle, les mises à jour s'installent par-dessus
      # l'ancienne version sans avoir à désinstaller (voir README).
      - name: Clé de signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'sbackup' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Compilation de l'APK
        run: |
          flutter build apk --release --build-name=$VERSION --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk sbackup.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sbackup-android
          path: sbackup.apk
          retention-days: 30

  # Une nouvelle version est publiée à chaque envoi sur « main », ou à la demande
  # (bouton « Run workflow », case « Publier »). Les liens …/releases/latest/download/…
  # du README pointent toujours vers la dernière.
  publication:
    name: Publication de la version
    needs: android
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || inputs.publier)
    runs-on: ubuntu-latest
    permissions:
      contents: write # nécessaire pour publier la Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: sBackup ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: sbackup.apk
          body: |
            sBackup compilé automatiquement (commit ${{ github.sha }}).

            **Sur le téléphone** : téléchargez `sbackup.apk`, ouvrez-le et autorisez l'installation
            d'applications de sources inconnues si Android le demande.
